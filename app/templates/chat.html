<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #ece5dd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 800px; /* Increased from 600px */
      height: 90vh;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px 16px;
      background: #075e54;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    #chat-box {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .message-container {
      display: flex;
      margin: 1px 0;
    }

    .message-container.left {
      justify-content: flex-start;
      margin-right: 50px;
    }

    .message-container.right {
      justify-content: flex-end;
      margin-left: 50px;
    }

    .chat-bubble {
      max-width: none;
      min-width: 50px;
      padding: 6px 7px 8px 9px;
      border-radius: 7.5px;
      word-wrap: break-word;
      font-size: 14px;
      line-height: 19px;
      position: relative;
      display: inline-block;
      box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
    }

    .message-container.left .chat-bubble {
      background: #ffffff;
      border-radius: 7.5px 7.5px 7.5px 0px;
    }

    .message-container.right .chat-bubble {
      background: #d9fdd3;
      border-radius: 7.5px 7.5px 0px 7.5px;
    }

    .timestamp {
      font-size: 11px;
      color: #667781;
      margin-top: 2px;
      text-align: right;
      float: right;
      margin-left: 10px;
    }

    .chat-input {
      display: flex;
      align-items: center;
      padding: 5px 16px 5px 10px;
      background: #f0f0f0;
      gap: 8px;
      border-top: 1px solid #e0e0e0;
    }

    .chat-input input[type="text"] {
      flex: 1;
      border: none;
      border-radius: 21px;
      padding: 9px 12px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
    }

    .chat-input input[type="file"] {
      display: none;
    }

    .file-label {
      background-color: #25d366;
      color: white;
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      width: 40px;
      height: 40px;
    }

    .file-label:hover {
      background-color: #1ebe5d;
    }

    .chat-input button {
      background: #25d366;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 18px;
      border-radius: 50%;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-input button:hover {
      background: #1ebe5d;
    }

    a.file-link {
      color: #0d6efd;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      margin-bottom: 4px;
      padding: 4px 8px;
      background: rgba(13, 110, 253, 0.1);
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    a.file-link:hover {
      text-decoration: underline;
      background: rgba(13, 110, 253, 0.2);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .chat-container {
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
      }
      
      .chat-bubble {
        max-width: 85%; /* Slightly wider on mobile */
        font-size: 14px;
      }
      
      .left, .right {
        max-width: 85%;
      }
      
      .file-label {
        max-width: 100px;
      }
    }

    /* Scrollbar styling */
    #chat-box::-webkit-scrollbar {
      width: 6px;
    }

    #chat-box::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    #chat-box::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }

    #chat-box::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    Chat with {{ receiver.full_name }}
  </div>

  <div id="chat-box">
    {% for msg in messages %}
      <div class="message-container {% if msg.sender == request.user %}right{% else %}left{% endif %}">
        <div class="chat-bubble">
          {% if msg.content %}
            {{ msg.content|linebreaksbr }}
          {% endif %}
          {% if msg.file %}
            <a href="{{ msg.file.url }}" class="file-link" target="_blank">📎 Download File</a><br>
          {% endif %}
          <div class="timestamp">{{ msg.timestamp|date:"H:i" }}</div>
        </div>
      </div>
    {% endfor %}
  </div>

  <form id="chat-form" class="chat-input" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="text" name="content" id="message-input" placeholder="Type a message..." />

    <label for="file-input" class="file-label">
      <i class="fas fa-paperclip"></i>
    </label>
    <input type="file" id="file-input" name="file">

    <button type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>

<script>
  const receiverId = "{{ receiver.id }}";
  const currentUserId = "{{ request.user.id }}";
  const chatBox = document.getElementById('chat-box');
  const messageInput = document.getElementById('message-input');
  const fileInput = document.getElementById('file-input');

  const chatSocket = new WebSocket(
    'ws://' + window.location.host + '/ws/chat/' + receiverId + '/'
  );

  chatSocket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (data.error) {
      alert(data.error);
      return;
    }

    const div = document.createElement('div');
    div.className = 'message-container ' + (data.is_self ? 'right' : 'left');
    div.innerHTML = `
      <div class="chat-bubble">
        ${data.message ? data.message.replace(/\n/g, '<br>') : ''}
        ${data.file_url ? `<a href="${data.file_url}" class="file-link" target="_blank">📎 Download File</a><br>` : ''}
        <div class="timestamp">${data.timestamp}</div>
      </div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  };

  document.getElementById('chat-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const content = messageInput.value.trim();
    const file = fileInput.files[0];

    if (!content && !file) return;

    if (file) {
      const reader = new FileReader();
      reader.onload = function () {
        chatSocket.send(JSON.stringify({
          message: content,
          file: reader.result,
          file_name: file.name
        }));
      };
      reader.readAsDataURL(file);
    } else {
      chatSocket.send(JSON.stringify({
        message: content
      }));
    }

    messageInput.value = '';
    fileInput.value = '';
  });

  fileInput.addEventListener('change', function () {
    const fileName = this.files[0]?.name;
    // File icon remains the same - no text change needed for WhatsApp style
  });

  // Auto-scroll to bottom on page load
  chatBox.scrollTop = chatBox.scrollHeight;

  // Focus on input when page loads
  messageInput.focus();
</script>

</body>
</html>
