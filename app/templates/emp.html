<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Agreement Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .container:hover {
      transform: translateY(-2px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: shimmer 4s ease-in-out infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%) translateY(-100%) rotate(0deg); }
      50% { transform: translateX(100%) translateY(100%) rotate(180deg); }
    }
    
    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .form-section, .preview-section {
      padding: 40px;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: translateY(0);
    }
    
    .form-section.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }
    
    .preview-section {
      display: none;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .preview-section.show {
      display: block;
      animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .form-group, .form-row {
      margin-bottom: 25px;
      transition: all 0.3s ease;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e5e9;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.8);
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 1);
    }
    
    .form-row {
      display: flex;
      gap: 20px;
    }
    
    .form-row .form-group {
      flex: 1;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 10px 5px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(86, 171, 47, 0.3);
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(86, 171, 47, 0.4);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
    }
    
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
    }
    
    .btn:disabled {
      background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
      color: #6c757d;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .btn-center {
      display: block;
      margin: 30px auto;
      width: fit-content;
    }
    
    .preview-content {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-height: 600px;
      overflow-y: auto;
      border: 1px solid #e1e5e9;
      position: relative;
    }
    
    .preview-content::-webkit-scrollbar {
      width: 8px;
    }
    
    .preview-content::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    
    .preview-content::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
    }
    
    .preview-content h3 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 700;
      position: relative;
      padding-bottom: 15px;
    }
    
    .preview-content h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
    }
    
    .editable-content {
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Times New Roman', serif;
      color: #333;
      transition: all 0.3s ease;
    }
    
    .editable-content:focus {
      outline: 2px solid #667eea;
      outline-offset: 4px;
      border-radius: 8px;
    }
    
    .signature-section {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 30px;
      border-top: 2px solid #e1e5e9;
    }
    
    .signature-block {
      width: 45%;
      text-align: center;
    }
    
    .signature-line {
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      transition: all 0.3s ease;
    }
    
    .signature-line:hover {
      border-bottom-color: #667eea;
    }
    
    .signature-label {
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #666;
    }
    
    .name-label {
      font-size: 14px;
      margin-top: 8px;
      font-weight: 700;
      color: #333;
    }
    
    .preview-actions {
      text-align: center;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e1e5e9;
    }
    
    .edit-note {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
      border: 2px solid #ffc107;
      color: #856404;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 30px;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2);
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .success-message {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border: 2px solid #28a745;
      color: #155724;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }
    
    .success-message.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      
      .container {
        margin: 10px;
        border-radius: 15px;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .form-section, .preview-section {
        padding: 20px;
      }
      
      .signature-section {
        flex-direction: column;
        gap: 40px;
      }
      
      .signature-block {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💼 Employee Agreement Generator</h1>
    </div>
    
    <div class="form-section" id="formSection">
      <form id="employeeForm">
        <div class="form-group">
          <label>Agreement Date</label>
          <input type="date" id="agreementDate" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="companyName" placeholder="Enter company name" required>
          </div>
          <div class="form-group">
            <label>Employee Name</label>
            <input type="text" id="employeeName" placeholder="Enter employee's full name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Company Address</label>
          <textarea id="companyAddress" placeholder="Enter complete company address" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="jobTitle" placeholder="e.g., Software Developer" required>
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" id="department" placeholder="e.g., Engineering" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Annual Salary ($)</label>
            <input type="number" id="annualSalary" placeholder="75000" required>
          </div>
          <div class="form-group">
            <label>Employment Type</label>
            <select id="employmentType" required>
              <option value="">Select type</option>
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Contract">Contract</option>
              <option value="Temporary">Temporary</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="startDate" required>
          </div>
          <div class="form-group">
            <label>Reporting Manager</label>
            <input type="text" id="reportingManager" placeholder="Manager's name" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Work Location</label>
            <input type="text" id="workLocation" placeholder="e.g., Remote, Office, Hybrid" required>
          </div>
          <div class="form-group">
            <label>Probation Period (Months)</label>
            <input type="number" id="probationPeriod" placeholder="3" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Notice Period (Days)</label>
            <input type="number" id="noticePeriod" placeholder="30" required>
          </div>
          <div class="form-group">
            <label>Vacation Days per Year</label>
            <input type="number" id="vacationDays" placeholder="20" required>
          </div>
        </div>

        <div class="form-group">
          <label>Benefits (Optional)</label>
          <textarea id="benefits" placeholder="e.g., Health insurance, 401k, dental coverage, etc."></textarea>
        </div>

        <div class="form-group">
          <label>Working Hours</label>
          <input type="text" id="workingHours" placeholder="e.g., 9:00 AM - 5:00 PM, Monday to Friday" required>
        </div>

        <div class="form-group">
          <label>Additional Terms (Optional)</label>
          <textarea id="additionalTerms" placeholder="Any additional terms or conditions"></textarea>
        </div>

        <button type="button" class="btn btn-primary btn-center" onclick="generatePreview()">
          📋 Generate Preview
        </button>
      </form>
    </div>

    <div class="preview-section" id="previewSection">
      <div class="edit-note">
        <strong>📝 Preview Mode:</strong> You can edit the document content below. Click and modify any text as needed before downloading.
      </div>
      
      <div class="preview-content">
        <h3>EMPLOYEE AGREEMENT</h3>
        <div id="editableContent" class="editable-content" contenteditable="true">
          <!-- Generated content will appear here -->
        </div>
        <div class="signature-section">
          <div class="signature-block">
            <div class="signature-line"></div>
            <div class="signature-label">Company Representative</div>
            <div id="companyNameDisplay" class="name-label">Company Name</div>
          </div>
          <div class="signature-block">
            <div class="signature-line"></div>
            <div class="signature-label">Employee Signature</div>
            <div id="employeeNameDisplay" class="name-label">Employee Name</div>
          </div>
        </div>
      </div>
      
      <div class="preview-actions">
        <button type="button" class="btn btn-secondary" onclick="backToForm()">
          ← Back to Form
        </button>
        <button type="button" class="btn btn-success" onclick="downloadAgreement()" id="downloadBtn">
          📄 Download Word Document
        </button>
      </div>
      <div id="successMessage" class="success-message">
        ✅ Document downloaded successfully!
      </div>
    </div>
  </div>

  <script>
    function getValue(id) {
      return document.getElementById(id).value || "";
    }

    function validateForm() {
      const requiredFields = [
        'agreementDate', 'companyName', 'employeeName', 'companyAddress',
        'jobTitle', 'department', 'annualSalary', 'employmentType', 'startDate',
        'reportingManager', 'workLocation', 'probationPeriod', 'noticePeriod',
        'vacationDays', 'workingHours'
      ];
      
      for (let field of requiredFields) {
        if (!getValue(field).trim()) {
          const fieldName = field.replace(/([A-Z])/g, ' $1').toLowerCase();
          alert(`Please fill in the ${fieldName}`);
          return false;
        }
      }
      return true;
    }

    function generateAgreementContent() {
      const benefitsSection = getValue("benefits").trim() 
        ? `\n\n7. Benefits. The Company shall provide the following benefits to the Employee:\n${getValue("benefits")}` 
        : '';

      const additionalTermsSection = getValue("additionalTerms").trim() 
        ? `\n\n15. Additional Terms. ${getValue("additionalTerms")}` 
        : '';

      return `This Employee Agreement (this "Agreement") is made effective as of ${getValue("agreementDate")}, by and between ${getValue("companyName")} ("Company") and ${getValue("employeeName")} ("Employee"). Company and Employee may be referred to individually as a "Party" and collectively as the "Parties."

1. Employment. Company hereby employs Employee, and Employee hereby accepts employment with Company, subject to the terms and conditions set forth in this Agreement.

2. Position and Duties. Employee is hired as ${getValue("jobTitle")} in the ${getValue("department")} department. Employee agrees to perform the duties and responsibilities inherent in such position and any other duties reasonably assigned by Company. Employee will report directly to ${getValue("reportingManager")} or their designated representative.

3. Compensation. As compensation for the services to be rendered under this Agreement, Company shall pay Employee an annual salary of $${parseInt(getValue("annualSalary")).toLocaleString()}, payable in accordance with Company's standard payroll practices. This salary may be reviewed and adjusted periodically at the sole discretion of Company.

4. Employment Classification. Employee's employment classification is ${getValue("employmentType")}. This is an at-will employment relationship, meaning that either Party may terminate the employment relationship at any time, with or without cause, and with or without notice, subject to the notice requirements set forth in this Agreement.

5. Work Schedule and Location. Employee's regular work schedule shall be ${getValue("workingHours")}. Employee will primarily work from ${getValue("workLocation")}. Any changes to work schedule or location must be approved in advance by Employee's supervisor.

6. Probationary Period. Employee's employment shall be subject to a probationary period of ${getValue("probationPeriod")} months from the start date. During this period, either Party may terminate the employment relationship with shorter notice as deemed appropriate by Company.${benefitsSection}

8. Vacation and Time Off. Employee shall be entitled to ${getValue("vacationDays")} vacation days per calendar year, to be accrued and used in accordance with Company's vacation policy. Unused vacation days may be carried over or paid out in accordance with applicable law and Company policy.

9. Confidentiality. Employee acknowledges that during the course of employment, Employee may have access to confidential and proprietary information belonging to Company. Employee agrees to maintain the confidentiality of such information and not to disclose it to any third party without prior written consent from Company. This obligation shall survive the termination of this Agreement.

10. Non-Disclosure and Non-Competition. Employee agrees not to engage in any business that directly competes with Company during the term of employment and for a period of one (1) year following termination. Employee also agrees not to solicit Company's clients, customers, or employees for a period of one (1) year following termination.

11. Intellectual Property. Any work product, inventions, discoveries, or other intellectual property created by Employee during the course of employment that relates to Company's business shall be the sole property of Company. Employee agrees to execute any documents necessary to transfer ownership of such intellectual property to Company.

12. Termination. Either Party may terminate this Agreement at any time, with or without cause. Employee agrees to provide at least ${getValue("noticePeriod")} days' written notice of resignation. Company may terminate Employee's employment immediately for cause, including but not limited to misconduct, violation of Company policies, or failure to perform job duties satisfactorily.

13. Return of Company Property. Upon termination of employment, Employee agrees to immediately return all Company property, including but not limited to documents, equipment, keys, access cards, and any other materials belonging to Company.

14. Governing Law. This Agreement shall be governed by and construed in accordance with the laws of the state in which Company's primary business location is situated, without regard to conflict of law principles.${additionalTermsSection}

16. Severability. If any provision of this Agreement is held to be invalid, illegal, or unenforceable, the remaining provisions shall continue in full force and effect.

17. Entire Agreement. This Agreement constitutes the entire agreement between the Parties and supersedes all prior negotiations, representations, or agreements relating to Employee's employment with Company. This Agreement may only be modified in writing signed by both Parties.

18. Acknowledgment. Employee acknowledges that they have read and understood this Agreement, have had the opportunity to consult with legal counsel, and voluntarily agree to be bound by its terms.

IN WITNESS WHEREOF, the Parties have executed this Agreement as of the date first written above.`;
    }

    function generatePreview() {
      if (!validateForm()) {
        return;
      }

      const content = generateAgreementContent();
      document.getElementById('editableContent').textContent = content;
      
      // Update signature names
      document.getElementById('companyNameDisplay').textContent = getValue("companyName");
      document.getElementById('employeeNameDisplay').textContent = getValue("employeeName");
      
      // Hide form and show preview with animation
      document.getElementById('formSection').classList.add('hidden');
      const previewSection = document.getElementById('previewSection');
      previewSection.style.display = 'block';
      
      // Trigger animation
      setTimeout(() => {
        previewSection.classList.add('show');
      }, 100);
      
      // Scroll to top of preview
      setTimeout(() => {
        previewSection.scrollIntoView({ behavior: 'smooth' });
      }, 300);
    }

    function backToForm() {
      // Hide preview and show form with animation
      const previewSection = document.getElementById('previewSection');
      previewSection.classList.remove('show');
      
      setTimeout(() => {
        previewSection.style.display = 'none';
        document.getElementById('formSection').classList.remove('hidden');
        
        // Scroll to top of form
        document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
      }, 300);
    }

    function downloadAgreement() {
      const downloadBtn = document.getElementById('downloadBtn');
      const successMessage = document.getElementById('successMessage');
      
      // Show loading state
      downloadBtn.innerHTML = '📄 Generating Document<span class="loading"></span>';
      downloadBtn.disabled = true;
      
      // Get the content from the editable div
      const editableElement = document.getElementById('editableContent');
      let content = '';
      
      // Check if content has been edited (HTML) or is original (text)
      if (editableElement.innerHTML.includes('<div>') || editableElement.innerHTML.includes('<br>')) {
        // Content has been edited, convert HTML to plain text with proper line breaks
        content = editableElement.innerHTML
          .replace(/<div>/g, '\n')
          .replace(/<\/div>/g, '')
          .replace(/<br\s*\/?>/g, '\n')
          .replace(/<[^>]*>/g, '') // Remove any other HTML tags
          .replace(/&nbsp;/g, ' ')
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"');
      } else {
        // Use original text content
        content = editableElement.textContent || editableElement.innerText;
      }
      
      if (!content.trim()) {
        alert('No content to download!');
        downloadBtn.innerHTML = '📄 Download Word Document';
        downloadBtn.disabled = false;
        return;
      }
      
      try {
        // Split content into paragraphs for proper formatting
        const paragraphs = content.split('\n\n').filter(p => p.trim());
        
        // Create RTF content for Word compatibility
        const rtfContent = `{\\rtf1\\ansi\\deff0 {\\fonttbl {\\f0 Times New Roman;}}
\\f0\\fs24
{\\qc\\b\\ul EMPLOYEE AGREEMENT\\par}
\\par
${paragraphs.map(p => p.trim() ? `{\\pard\\qj ${p.trim().replace(/\n/g, '\\line ')}\\par}\\par` : '').join('')}
\\par
\\par

{\\trowd\\trgaph180\\cellx4320\\cellx8640
\\pard\\intbl\\qc\\sb360
{\\ul _________________________________} \\line
{\\fs20 Company Representative}\\line
{\\b\\fs22 ${getValue("companyName")}}\\line
{\\fs20 Company Name}\\cell
\\pard\\intbl\\qc\\sb360
{\\ul _________________________________} \\line
{\\fs20 Employee Signature}\\line
{\\b\\fs22 ${getValue("employeeName")}}\\line
{\\fs20 Employee Name}\\cell
\\row}

}`;

        // Generate filename
        const filename = `Employee_Agreement_${getValue("companyName").replace(/\s+/g, '_')}_${getValue("employeeName").replace(/\s+/g, '_')}.rtf`;
        
        // Create blob with RTF MIME type
        const blob = new Blob([rtfContent], { 
            type: 'application/rtf'
        });
        
        // Create download link and trigger automatic download
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        
        // Ensure download attribute is respected
        a.setAttribute('download', filename);
        
        document.body.appendChild(a);
        
        // Force download without dialog
        setTimeout(() => {
          a.click();
          
          // Clean up
          setTimeout(() => {
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
          }, 100);
        }, 100);
        
        // Show success message
        setTimeout(() => {
          downloadBtn.innerHTML = '📄 Download Word Document';
          downloadBtn.disabled = false;
          successMessage.classList.add('show');
          
          // Hide success message after 3 seconds
          setTimeout(() => {
            successMessage.classList.remove('show');
          }, 3000);
        }, 1000);
        
      } catch (error) {
        console.error('Error generating document:', error);
        alert('There was an error generating the document. Please try again.');
        downloadBtn.innerHTML = '📄 Download Word Document';
        downloadBtn.disabled = false;
      }
    }

    // Set today's date as default for agreement date
    document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('agreementDate').value = today;
      
      // Add smooth focus animations
      const inputs = document.querySelectorAll('input, select, textarea');
      inputs.forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'translateY(-2px)';
        });
        
        input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'translateY(0)';
        });
      });
    });
  </script>
</body>
</html>
