<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lease Agreement</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .container:hover {
      transform: translateY(-2px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: shimmer 4s ease-in-out infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%) translateY(-100%) rotate(0deg); }
      50% { transform: translateX(100%) translateY(100%) rotate(180deg); }
    }
    
    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .form-section, .preview-section {
      padding: 40px;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: translateY(0);
    }
    
    .form-section.hidden {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }
    
    .preview-section {
      display: none;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .preview-section.show {
      display: block;
      animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .form-group, .form-row {
      margin-bottom: 25px;
      transition: all 0.3s ease;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e5e9;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.8);
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 1);
    }
    
    .form-row {
      display: flex;
      gap: 20px;
    }
    
    .form-row .form-group {
      flex: 1;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 10px 5px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(86, 171, 47, 0.3);
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(86, 171, 47, 0.4);
    }
    
    .btn-secondary {
      background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
    }
    
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
    }
    
    .btn:disabled {
      background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
      color: #6c757d;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .btn-center {
      display: block;
      margin: 30px auto;
      width: fit-content;
    }
    
    .preview-content {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-height: 600px;
      overflow-y: auto;
      border: 1px solid #e1e5e9;
      position: relative;
    }
    
    .preview-content::-webkit-scrollbar {
      width: 8px;
    }
    
    .preview-content::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    
    .preview-content::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
    }
    
    .preview-content h3 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 700;
      position: relative;
      padding-bottom: 15px;
    }
    
    .preview-content h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
    }
    
    .editable-content {
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Times New Roman', serif;
      color: #333;
      transition: all 0.3s ease;
    }
    
    .editable-content:focus {
      outline: 2px solid #667eea;
      outline-offset: 4px;
      border-radius: 8px;
    }
    
    .signature-section {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 30px;
      border-top: 2px solid #e1e5e9;
    }
    
    .signature-block {
      width: 45%;
      text-align: center;
    }
    
    .signature-line {
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      transition: all 0.3s ease;
    }
    
    .signature-line:hover {
      border-bottom-color: #667eea;
    }
    
    .signature-label {
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #666;
    }
    
    .name-label {
      font-size: 14px;
      margin-top: 8px;
      font-weight: 700;
      color: #333;
    }
    
    .preview-actions {
      text-align: center;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e1e5e9;
    }
    
    .edit-note {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
      border: 2px solid #ffc107;
      color: #856404;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 30px;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2);
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .success-message {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border: 2px solid #28a745;
      color: #155724;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }
    
    .success-message.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      
      .container {
        margin: 10px;
        border-radius: 15px;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .form-section, .preview-section {
        padding: 20px;
      }
      
      .signature-section {
        flex-direction: column;
        gap: 40px;
      }
      
      .signature-block {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏠 Lease Agreement Generator</h1>
    </div>
    
    <div class="form-section" id="formSection">
      <form id="leaseForm">
        <div class="form-group">
          <label>Agreement Date</label>
          <input type="date" id="agreementDate" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Landlord Name</label>
            <input type="text" id="landlordName" placeholder="Enter landlord's full name" required>
          </div>
          <div class="form-group">
            <label>Tenant Name</label>
            <input type="text" id="tenantName" placeholder="Enter tenant's full name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Property Address</label>
          <textarea id="propertyAddress" placeholder="Enter complete property address" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Monthly Rent ($)</label>
            <input type="number" id="monthlyRent" placeholder="2000" required>
          </div>
          <div class="form-group">
            <label>Security Deposit ($)</label>
            <input type="number" id="securityDeposit" placeholder="2000" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Lease Start Date</label>
            <input type="date" id="leaseStartDate" required>
          </div>
          <div class="form-group">
            <label>Lease End Date</label>
            <input type="date" id="leaseEndDate" required>
          </div>
        </div>

        <div class="form-group">
          <label>Rent Due Date (Day of Month)</label>
          <select id="rentDueDate" required>
            <option value="">Select day</option>
            <option value="1st">1st</option>
            <option value="5th">5th</option>
            <option value="15th">15th</option>
            <option value="30th">30th</option>
          </select>
        </div>

        <div class="form-group">
          <label>Late Fee Amount ($)</label>
          <input type="number" id="lateFee" placeholder="50" required>
        </div>

        <div class="form-group">
          <label>Late Fee Grace Period (Days)</label>
          <input type="number" id="gracePeriod" placeholder="5" required>
        </div>

        <div class="form-group">
          <label>Landlord Address for Notices</label>
          <textarea id="landlordAddress" placeholder="Enter landlord's address for legal notices" required></textarea>
        </div>

        <div class="form-group">
          <label>Tenant Address for Notices</label>
          <textarea id="tenantAddress" placeholder="Enter tenant's address for legal notices" required></textarea>
        </div>

        <div class="form-group">
          <label>Additional Terms (Optional)</label>
          <textarea id="additionalTerms" placeholder="Any additional terms or conditions"></textarea>
        </div>

        <button type="button" class="btn btn-primary btn-center" onclick="generatePreview()">
          📋 Generate Preview
        </button>
      </form>
    </div>

    <div class="preview-section" id="previewSection">
      <div class="edit-note">
        <strong>📝 Preview Mode:</strong> You can edit the document content below. Click and modify any text as needed before downloading.
      </div>
      
      <div class="preview-content">
        <h3>LEASE AGREEMENT</h3>
        <div id="editableContent" class="editable-content" contenteditable="true">
          <!-- Generated content will appear here -->
        </div>
        <div class="signature-section">
          <div class="signature-block">
            <div class="signature-line"></div>
            <div class="signature-label">Landlord Signature</div>
            <div id="landlordNameDisplay" class="name-label">Landlord Name</div>
          </div>
          <div class="signature-block">
            <div class="signature-line"></div>
            <div class="signature-label">Tenant Signature</div>
            <div id="tenantNameDisplay" class="name-label">Tenant Name</div>
          </div>
        </div>
      </div>
      
      <div class="preview-actions">
        <button type="button" class="btn btn-secondary" onclick="backToForm()">
          ← Back to Form
        </button>
        <button type="button" class="btn btn-success" onclick="downloadLease()" id="downloadBtn">
          📄 Download Word Document
        </button>
      </div>
      <div id="successMessage" class="success-message">
        ✅ Document downloaded successfully!
      </div>
    </div>
  </div>

  <script>
    function getValue(id) {
      return document.getElementById(id).value || "";
    }

    function validateForm() {
      const requiredFields = [
        'agreementDate', 'landlordName', 'tenantName', 'propertyAddress',
        'monthlyRent', 'securityDeposit', 'leaseStartDate', 'leaseEndDate',
        'rentDueDate', 'lateFee', 'gracePeriod', 'landlordAddress', 'tenantAddress'
      ];
      
      for (let field of requiredFields) {
        if (!getValue(field).trim()) {
          const fieldName = field.replace(/([A-Z])/g, ' $1').toLowerCase();
          alert(`Please fill in the ${fieldName}`);
          return false;
        }
      }
      return true;
    }

    function generateLeaseContent() {
      const additionalTermsSection = getValue("additionalTerms").trim() 
        ? `42. Additional Terms. ${getValue("additionalTerms")}\n\n` 
        : '';

      return `This Lease Agreement (this "Agreement") is made this ${getValue("agreementDate")}, by and between ${getValue("landlordName")} ("Landlord") and ${getValue("tenantName")} ("Tenant"). Each Landlord and Tenant may be referred to individually as a "Party" and collectively as the "Parties."

1. Premises. The Premises leased are ${getValue("propertyAddress")} (the "Premises").

2. Agreement to Lease. Landlord agrees to lease to Tenant and Tenant agrees to lease from Landlord, according to the terms and conditions set forth herein, the Premises.

3. Term. This Agreement will be for a term beginning on ${getValue("leaseStartDate")} and ending on ${getValue("leaseEndDate")} (the "Term").

4. Rent. Rent will be payable in advance and due on the ${getValue("rentDueDate")} day of each month during the Term. Rent for any partial month at the start of the Term which commenced on other than on the date, or date such shall be a pro-rata portion of the monthly installment. Rent will be paid to Landlord at Landlord's address provided herein (or to such other places as may be designated by Landlord) by check or money order payable to Landlord, and payable in U.S. Dollars.

4a. Initial Payments. Upon execution of this Agreement by Tenant and as a condition of consideration for executing by Landlord, Tenant shall pay to Landlord the following:

Monthly Rent: $${getValue("monthlyRent")}
Security Deposit: $${getValue("securityDeposit")}

5. Late Fee. Rent paid after the ${getValue("rentDueDate")} day of each month will be deemed as late, and if rent is not paid within ${getValue("gracePeriod")} days after the due date, Tenant agrees to pay a late charge of $${getValue("lateFee")}.

6. Additional Rent. There may be instances under this Agreement where Tenant may be required to pay additional charges to Landlord. All such charges are considered additional rent under this Agreement will be paid with the next regularly scheduled rent payment. Landlord has the same rights and Tenant has the same obligations with respect to additional rent as they do with rent.

7. Utilities. Tenant is responsible for payment of all utility and other services for the Premises.

8. Landlord's Failure to Give Possession. In the event Landlord is unable to give possession of the Premises to Tenant on the start date of the Term, Landlord will not be subject to any liability for such failure, the validity of this Agreement will not be affected, and the Term will not be extended. Tenant will not be liable for rent until actual possession of the Premises by Tenant. Notwithstanding anything herein to the contrary, if Landlord does not deliver possession of the Premises within ${getValue("gracePeriod")} days of the Start Date, Tenant may cancel this Agreement upon notice to Landlord and Landlord shall, within ${getValue("gracePeriod")} days, return all monies paid by Tenant to Landlord.

9. Use of Premises. The Premises will be occupied only by Tenant and Tenant's immediate family and used only for residential purposes. Tenant will not engage in any objectionable conduct, including behavior which will interfere with the rights of others to enjoy their property. Tenant will not allow on the Premises excessive noise, music, or other activities which will disturb others or allow others to enjoy their property. Tenant will be liable for any damage occurring to the Premises and any damage thereof caused by Tenant or Tenant's agents or guests.

10. Condition of the Premises. Tenant has examined the Premises, including the appliances, fixtures, carpets, drapes, and paint, and has found them to be in good, safe, clean, and rentable condition and repair, normal wear accepted and fair, and accepts the Premises in such condition.

11. Maintenance and Repairs. Tenant will maintain the Premises, including appliances, fixtures and furnishings, in clean, sanitary and good condition and repair. Tenant will promptly reimburse Landlord for the cost of repair of any damage beyond normal wear and tear caused by Tenant or remove any appliances, fixtures, or furnishings from the Premises for any purpose. If repairs other than general maintenance are needed, Tenant will notify Landlord promptly but will make no repairs without the prior written consent of Landlord. Tenant will reimburse Landlord for the cost of any repairs or replacement.

12. Reasonable Accommodation. Landlord or their agent will comply with all applicable laws providing equal housing opportunities, including making reasonable accommodations for known physical or mental limitations of qualified individuals with a disability, unless making readily available accommodations would be unreasonable or would cause undue hardship. Requests for accommodation must be made known by tenancy by writing. If the disability is not readily apparent and Landlord has the right to use the qualified medical professional to provide relevant information about the accommodation.

13. Sex Offender Registry. Pursuant to law, information about specified registered sex offenders is made available to the public via an Internet Web site maintained by the Department of Justice. Depending on an offender's criminal history, this information will include either the address at which the offender resides or the community of residence and zip code in which he or she resides.

14. Compliance. Tenant agrees to comply with all applicable laws, ordinances, requirements and regulations of any federal, state, county, municipal or other authority.

15. Mechanic's Lien. Tenant understands and agrees that Tenant and anyone acting on Tenant's behalf does not have the right to file for mechanic's liens or any other kind of liens on the Premises. Tenant agrees to give actual notice to any contractor, subcontractor, supplier, materialman, laborer or other such services that such liens are invalid. Tenant further agrees to take the additional steps necessary to keep the Premises free of any and all liens that may result from construction completed by or for Tenant.

16. Subordination. With respect to the Premises, this Agreement is subordinate to any mortgage that now exists, or may be given later by Landlord.

17. Alterations. Tenant will not make any alteration, addition or improvement to the Premises without first obtaining Landlord's written consent. Any and all alterations, additions or improvements to the Premises are without payment to Tenant and will become Landlord's property and will automatically and immediately remain on the Premises, unless Landlord requests or permits removal, in which case Tenant will return that part of the Premises to the same condition as before the addition or improvement was made at Tenant's cost and expense. Tenant will not change any existing locks or install any additional locks on the Premises without first obtaining Landlord's written consent.

18. Smoking. Smoking of any kind is strictly prohibited on any part of the Premises. This prohibition applies to Tenant and any guests or visitors of Tenant.

19. Pets. Tenant is not allowed to have or keep any pets, even temporarily, on any part of the Premises. The unauthorized presence of any pet will subject Tenant to charges for violation of this provision and termination of this Agreement. Properly trained service animals that provide assistance to individuals with disabilities may be permitted in the Premises as a reasonable accommodation that may not be unreasonably withheld. Tenant will be responsible for the cost of de-fleaing, deodorizing and/or shampooing as a result of the Premises if it becomes necessary or if there is damage, at any time during the Term (whether with or without written consent of Landlord).

20. Fire and Casualty. If the Premises are damaged by fire, earthquake or other serious disaster and the Premises becomes uninhabitable as a result, Tenant may immediately vacate the Premises and terminate the Agreement upon notice to Landlord. If Tenant vacates, Landlord will refund all unused rent to receive any prorated rent not to be day of such fire, disaster or accident. If the Premises are only partially damaged and not uninhabitable but may make the full accommodations for which it may be reduced within the regard are being made available to Tenant as the residence of Landlord.

21. Liability. Landlord is not responsible to Tenant for any loss, damage, theft, shortage of any accident, injury or damage to any person or property occurring anywhere on the Premises, unless resulting from the gross negligence or willful misconduct of Landlord.

22. Assignment and Subletting. Tenant will not assign this Agreement as any portion or all of the Premises or sublet any part or all of the Premises.

23. Insurance Requirements. Tenant will not do or permit to be done any act or thing that will increase the insurance rates of any policy of insurance covering the Premises. If the premium for such policy of insurance increases due to a breach of Tenant's obligations under this Agreement, Tenant will pay the additional amount of the premium within rent or upon demand.

24. Right of Entry. Landlord or his agents may enter the Premises at reasonable times to inspect the Premises, to make or arrange for repairs or to show the Premises to a prospective purchaser, mortgagee, tenant, buyer or lessor. In the event of an emergency, Landlord may enter the Premises at any time.

25. Surrender. Tenant will deliver and surrender to Landlord possession of the Premises immediately upon the expiration or earlier termination of this Agreement, in as good condition and repair as the Premises was at the commencement of the Term, reasonable wear and tear excepted.

26. Default. In the event Tenant fails to comply with any financial or other obligation under this Agreement of default and an opportunity to correct such default, if Tenant fails to correct the default, other than a failure to pay rent or additional rent as specified in this Agreement, Landlord may terminate this Agreement by giving written notice. In the event of termination of this Agreement, Tenant remains liable for any rent, additional rent, costs, including costs to remedy any defaults that may be assessed by the landlord, whether or not they occur after the expiration of this Agreement.

27. Remedies. If this Agreement is terminated due to Tenant's default, Landlord may, in addition to any rights and remedies available under this Agreement and under law, any each and every other remedy, eviction or other similar legal proceedings available by law or in equity.

28. Subordination. This Agreement is and shall be subordinate, junior and inferior to any mortgage, deed of trust, and/or any other lien or encumbrance now or hereafter placed on the Premises by Landlord, operation and effect of each existing or future mortgage, deed of trust, ground lease and/or any other similar instrument, unless subordinate, covering any or all of the Premises, without the necessity of any further subordination, replacement or extension thereof.

29. Condemnation. If all or substantially all of the Premises are covered by a condemnation including the exercise of any power of eminent domain by a governmental authority, this Agreement shall terminate as of the date of taking. If part of the Premises is condemned, Landlord may terminate this Agreement shall be prorated and paid to such date. Landlord is entitled to collect from the condemning authority the entire amount of any award made in any proceedings without any right, title or interest which Tenant may have to any such award and agrees not to make any claim for the Term of this Agreement.

30. Hazardous Materials. Tenant shall not keep on the Premises any item of a dangerous, flammable, or explosive character that might unreasonably increase the danger of fire or explosion on the Premises or that might be considered hazardous or extra hazardous by any responsible insurance company.

31. Notices. All notices given under this Agreement must be in writing. A notice is effective upon receipt and shall be delivered in person, sent via certified or registered mail to the following addresses (or to such other Party):

Notices shall be sent to the Landlord at the following address:
${getValue("landlordAddress")}

Notices shall be sent to the Tenant at the following address:
${getValue("tenantAddress")}

32. Quiet Enjoyment. If Tenant pays the rent and performs all other obligations under this Agreement, Tenant may peacefully and quietly hold and enjoy the Premises during the Term.

33. No Waiver. No Party shall be deemed to have waived any provision of the Agreement or the exercise of any rights held under unless such waiver is made specifically and in writing.

    function renumberContent(content) {
      // Split content into lines
      const lines = content.split('\n');
      let currentNumber = 1;
      
      // Process each line and renumber
      const renumberedLines = lines.map(line => {
        // Check if line starts with a number followed by a period
        const match = line.match(/^(\d+)\.\s+(.+)/);
        if (match) {
          const newLine = `${currentNumber}. ${match[2]}`;
          currentNumber++;
          return newLine;
        }
        return line;
      });
      
      return renumberedLines.join('\n');
    }

      document.getElementById('agreementDate').value = today;
      
      // Add smooth focus animations
      const inputs = document.querySelectorAll('input, select, textarea');
      inputs.forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'translateY(-2px)';
        });
        
        input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'translateY(0)';
        });
      });
      
      // Add content observer for auto-renumbering in preview
      const editableContent = document.getElementById('editableContent');
      let timeout;
      
      editableContent.addEventListener('input', function() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          const currentContent = this.textContent || this.innerText;
          const renumberedContent = renumberContent(currentContent);
          if (renumberedContent !== currentContent) {
            // Save cursor position
            const selection = window.getSelection();
            const range = selection.rangeCount > 0 ? selection.getRangeAt(0) : null;
            const cursorOffset = range ? range.startOffset : 0;
            
            // Update content
            this.textContent = renumberedContent;
            
            // Restore cursor position (approximate)
            if (range) {
              try {
                const newRange = document.createRange();
                const textNode = this.firstChild;
                if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                  const newOffset = Math.min(cursorOffset, textNode.textContent.length);
                  newRange.setStart(textNode, newOffset);
                  newRange.setEnd(textNode, newOffset);
                  selection.removeAllRanges();
                  selection.addRange(newRange);
                }
              } catch (e) {
                // If cursor restoration fails, just continue
              }
            }
          }
        }, 500);
      });
