<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AILA - Login | Legal Innovation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #ffffff;
            overflow: hidden;
            background: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Advanced animated background */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .geometric-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            animation: geometricShift 20s ease-in-out infinite;
        }

        @keyframes geometricShift {
            0%, 100% { transform: rotate(0deg) scale(1); }
            33% { transform: rotate(120deg) scale(1.1); }
            66% { transform: rotate(240deg) scale(0.9); }
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .floating-element {
            position: absolute;
            width: 1px;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) scale(1);
                opacity: 0.4;
            }
            25% { 
                transform: translateY(-30px) translateX(15px) scale(1.2);
                opacity: 0.8;
            }
            50% { 
                transform: translateY(-60px) translateX(-15px) scale(0.8);
                opacity: 0.6;
            }
            75% { 
                transform: translateY(-30px) translateX(-30px) scale(1.1);
                opacity: 0.9;
            }
        }

        /* Login Container - Reduced height */
        .login-container {
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2rem 2rem;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo - Reduced spacing */
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, rgba(255, 255, 255, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Form Title - Reduced spacing */
        .form-title {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-title h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.3rem;
            letter-spacing: -0.01em;
        }

        .form-title p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Style for Django form paragraphs */
        form p {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            position: relative;
        }

        /* Labels */
        label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        /* Input Container - Fixed height to prevent shifting */
        .input-container {
            position: relative;
            min-height: 48px; /* Fixed height */
        }

        /* Inputs */
        input {
            width: 100%;
            height: 48px;
            padding: 0 1rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Password input with eye icon */
        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 3rem;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            z-index: 10;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #ffffff;
            transform: translateY(-50%) scale(1.1);
        }

        /* Input validation states - only show when form is submitted */
        input.valid {
            border-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        input.invalid {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        /* Validation messages - positioned absolutely to prevent layout shift */
        .validation-message {
            font-size: 0.75rem;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 0.3rem;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .validation-message.show {
            opacity: 1;
            pointer-events: auto;
        }

        .validation-message.success {
            color: #10B981;
        }

        .validation-message.error {
            color: #EF4444;
        }

        /* Form field wrapper to accommodate validation messages */
        .field-wrapper {
            position: relative;
            margin-bottom: 1.5rem; /* Space for validation messages */
        }

        /* Submit button */
        button[type="submit"] {
            height: 50px;
            border-radius: 14px;
            border: none;
            outline: none;
            background: #ffffff;
            color: #000000;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        button[type="submit"]:hover::before {
            left: 100%;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(255, 255, 255, 0.2);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loading state */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-top: 2px solid #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error message */
        .error {
            color: #EF4444;
            font-weight: 600;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            padding: 0.8rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(20px);
        }

        /* Links below form - Reduced spacing */
        .links {
            margin-top: 1.5rem;
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .links p {
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .links a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #ffffff;
            transition: width 0.3s ease;
        }

        .links a:hover::after {
            width: 100%;
        }

        .links a:hover {
            transform: translateY(-1px);
        }

        /* Forgot password link */
        .forgot-password {
            text-align: right;
            margin-top: 0.3rem;
        }

        .forgot-password a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: #ffffff;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Premium selection styles */
        ::selection {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                padding: 1.5rem 1.2rem;
                max-width: 100%;
                max-height: 95vh;
                overflow-y: auto;
                border-radius: 20px;
            }

            .logo h1 {
                font-size: 1.8rem;
            }

            .form-title h2 {
                font-size: 1.4rem;
            }

            input {
                height: 44px;
                font-size: 0.9rem;
            }

            button[type="submit"] {
                height: 46px;
            }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
            overflow: hidden;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Focus indicator */
        .input-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0.7));
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .input-container:focus-within::after {
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="bg-effects">
        <div class="geometric-pattern"></div>
        <div class="floating-elements" id="floatingElements"></div>
    </div>

    <div class="login-container">
        <div class="logo">
            <h1>AILA</h1>
            <p>Legal Innovation Platform</p>
        </div>

        <form method="post" id="loginForm" novalidate autocomplete="off">
            {% csrf_token %}
            
            <!-- Username/Email Field -->
            <div class="field-wrapper">
                <label for="id_email">Email</label>
                <div class="input-container">
                    <input type="email" name="email" id="id_email" required placeholder="Enter your email" autocomplete="off">
                    <div class="validation-message" id="email-validation"></div>
                </div>
            </div>

            <!-- Password Field -->
            <div class="field-wrapper">
                <label for="id_password">Password</label>
                <div class="input-container password-field">
                    <input type="password" name="password" id="id_password" required placeholder="Enter your password" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                    <div class="validation-message" id="password-validation"></div>
                </div>
                <div class="forgot-password">
                    <a href="{% url 'forgot_password' %}">Forgot Password?</a>

                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn">
                <span class="button-text">Log In</span>
                <div class="loading" id="loadingSpinner">
                    <div class="spinner"></div>
                    <span>Log in...</span>
                </div>
            </button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <div class="links">
            <p>Don't have an account? <a href="{% url 'user_signup' %}">Sign up as user</a></p>
            <p>Are you a lawyer? <a href="{% url 'lawyer_signup' %}">Sign up as lawyer</a></p>
        </div>
    </div>

    <script>
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }
    
    // Clear form data on page load/back button
 window.addEventListener('pageshow', function(event) {
    if (event.persisted || window.performance && window.performance.navigation.type === 2) {
        // Page was loaded from cache (back button)
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const buttonText = document.querySelector('.button-text');
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        if (form) {
            form.reset();
            // Clear validation states
            const inputs = form.querySelectorAll('input');
            inputs.forEach(input => {
                input.classList.remove('valid', 'invalid');
                input.value = '';
            });
            // Clear validation messages
            const validationMessages = form.querySelectorAll('.validation-message');
            validationMessages.forEach(msg => {
                msg.className = 'validation-message';
                msg.textContent = '';
            });
        }
        
        // Reset button state
        if (submitBtn) {
            submitBtn.disabled = false;
        }
        if (buttonText) {
            buttonText.style.display = 'inline';
        }
        if (loadingSpinner) {
            loadingSpinner.classList.remove('active');
        }
    }
});
    // Prevent back button cache
    window.addEventListener('beforeunload', function() {
        window.scrollTo(0, 0);
    });
        // Create floating elements
        function createFloatingElements() {
            const container = document.getElementById('floatingElements');
            const elementCount = 30;
            
            for (let i = 0; i < elementCount; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.style.left = Math.random() * 100 + '%';
                element.style.top = Math.random() * 100 + '%';
                element.style.animationDelay = Math.random() * 8 + 's';
                element.style.animationDuration = (Math.random() * 4 + 6) + 's';
                container.appendChild(element);
            }
        }

        // Password visibility toggle
        function togglePassword() {
            const passwordInput = document.getElementById('id_password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }

        // Validation function - only called on form submit
        // Replace the validateField function (around line 280) with this corrected version:
function validateField(field, validationElement) {
    const value = field.value.trim();
    let isValid = false;
    let message = '';

    if (field.name === 'email') { // Changed from 'username' to 'email'
        if (value.length === 0) {
            message = 'Email is required';
        } else {
            // Email validation only
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(value)) {
                isValid = true;
            } else {
                message = 'Please enter a valid email address';
            }
        }
    } else if (field.name === 'password') {
        if (value.length === 0) {
            message = 'Password is required';
        } else if (value.length < 8) {
            message = 'Password must be at least 8 characters';
        } else {
            isValid = true;
        }
    }

    // Update field styling only if validation was triggered
    field.classList.remove('valid', 'invalid');
    if (message) {
        field.classList.add(isValid ? 'valid' : 'invalid');
    }

    // Update validation message
    if (message && !isValid) {
        validationElement.textContent = message;
        validationElement.className = 'validation-message error show';
    } else {
        validationElement.textContent = '';
        validationElement.className = 'validation-message';
    }

    return isValid;
}

// Replace the validateForm function (around line 320) with this:
function validateForm() {
    const emailField = document.getElementById('id_email'); // Changed from id_username
    const passwordField = document.getElementById('id_password');
    const emailValidation = document.getElementById('email-validation'); // Changed from username-validation
    const passwordValidation = document.getElementById('password-validation');

    const emailValid = validateField(emailField, emailValidation);
    const passwordValid = validateField(passwordField, passwordValidation);

    return emailValid && passwordValid;
}

// Replace the DOMContentLoaded event listener (around line 330) with this updated version:
document.addEventListener('DOMContentLoaded', function() {
    createFloatingElements();
    
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const buttonText = document.querySelector('.button-text');
    const loadingSpinner = document.getElementById('loadingSpinner');
    
    // Get form fields - Updated field references
    const emailField = document.getElementById('id_email');
    const passwordField = document.getElementById('id_password');

    // Clear autocomplete values on page load
    setTimeout(() => {
        if (emailField) emailField.value = '';
        if (passwordField) passwordField.value = '';
        
        // Clear any existing validation states
        [emailField, passwordField].forEach(field => {
            if (field) {
                field.classList.remove('valid', 'invalid');
                const validationElement = field.closest('.field-wrapper').querySelector('.validation-message');
                if (validationElement) {
                    validationElement.className = 'validation-message';
                    validationElement.textContent = '';
                }
            }
        });
    }, 100);

    // Remove any existing error states when user starts typing
    [emailField, passwordField].forEach(field => {
        if (field) {
            field.addEventListener('input', function() {
                // Clear validation states when user starts typing
                this.classList.remove('valid', 'invalid');
                const validationElement = this.closest('.field-wrapper').querySelector('.validation-message');
                if (validationElement) {
                    validationElement.className = 'validation-message';
                    validationElement.textContent = '';
                }
            });
        }
    });

    // Form submission - validate only on submit
    form.addEventListener('submit', function(e) {
        // Always prevent default first to handle validation
        e.preventDefault();
        
        if (!validateForm()) {
            return;
        }

        // Show loading state for better UX
        submitBtn.disabled = true;
        buttonText.style.display = 'none';
        loadingSpinner.classList.add('active');

        // Submit form programmatically after validation passes
        setTimeout(() => {
            form.submit();
        }, 500);
    });

    // Enhanced input focus effects
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });

        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    // Fade in effect
    document.body.style.opacity = '0';
    setTimeout(() => {
        document.body.style.opacity = '1';
        document.body.style.transition = 'opacity 0.5s ease';
    }, 100);

    // Add ripple effect to submit button
    submitBtn.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple');
        
        this.appendChild(ripple);
        
        setTimeout(() => {
            ripple.remove();
        }, 600);
    });
    function resetButtonState() {
    if (submitBtn) {
        submitBtn.disabled = false;
    }
    if (buttonText) {
        buttonText.style.display = 'inline';
    }
    if (loadingSpinner) {
        loadingSpanner.classList.remove('active');
    }
}

// Call reset function on page load
resetButtonState();
});
    </script>
</body>
</html>
